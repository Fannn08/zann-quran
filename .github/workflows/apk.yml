name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npm ls @capacitor/android || npm install @capacitor/android
      - run: npm install capacitor-music-controls-plugin --legacy-peer-deps || true
      - run: cp index.html www/index.html
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i '0,/<application/s##<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zann-quran-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
