<!DOCTYPE html>
<html lang="id" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10" id="tc">
<title>Zann Qur’an</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--arsize:36px;--ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,Roboto,sans-serif;--ar:'Scheherazade New','Amiri Quran','Noto Naskh Arabic',serif;--r:20px}
[data-theme=midnight]{--bg:#000;--sf:#1C1C1E;--sf2:#2C2C2E;--tx:#fff;--mu:#8E8E93;--ln:rgba(84,84,88,.5);--ac:#34D6A6;--on:#00281C;--gl:rgba(28,28,30,.72);color-scheme:dark}
[data-theme=emerald]{--bg:#F2F2F7;--sf:#fff;--sf2:#E9E9EE;--tx:#000;--mu:#6C6C70;--ln:rgba(60,60,67,.18);--ac:#0A8F6A;--on:#fff;--gl:rgba(249,249,251,.78);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 var(--ui);transition:background .25s}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;padding:env(safe-area-inset-top) 0 0;background:var(--gl);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--ln)}
.bar .in{max-width:680px;margin:0 auto;height:48px;padding:0 8px;display:flex;align-items:center}
.bar h1{margin:0;font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk,.tb{border:0;background:none;color:var(--ac);font-size:17px;min-width:84px;height:44px;padding:0 8px}
.bk{text-align:left}.tb{text-align:right}
.bar.lg{border-bottom-color:transparent}
.bar.lg .in{display:none}
.lt{max-width:680px;margin:0 auto;padding:14px 20px 6px;font-size:34px;font-weight:700;letter-spacing:-.02em}
.search{width:100%;height:40px;border:0;border-radius:12px;background:var(--sf2);padding:0 14px;margin:8px 0 16px;font-size:16px}
.search::placeholder{color:var(--mu)}
.grp{background:var(--sf);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 16px;position:relative}
.row+.row:before{content:"";position:absolute;top:0;left:66px;right:0;border-top:.5px solid var(--ln)}
.row:active{background:var(--sf2)}
.row .no{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--ac) 16%,transparent);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ac)}
.row b{display:block;font-weight:600;font-size:16px}
.row small{color:var(--mu);font-size:13.5px}
.row .ar{font-family:var(--ar);font-size:24px;color:var(--ac)}
.row.cv:after{content:"›";color:var(--mu);font-size:26px;line-height:1}
.resume{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:var(--r);background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#0b4a8f));color:var(--on);padding:16px 18px;margin-bottom:16px}
.resume small{display:block;opacity:.8}.resume b{font-size:17px}.resume .ar{font-family:var(--ar);font-size:28px}
.hero{text-align:center;padding:20px 0 6px}
.hero .ar{font-family:var(--ar);font-size:48px;line-height:1.5;color:var(--ac)}
.hero p{margin:0;color:var(--mu);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:8px -16px 14px;padding:0 16px}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-radius:17px;background:var(--sf);font-size:14px;font-weight:600;color:var(--mu)}
.chip i{width:10px;height:10px;border-radius:50%}
.chip small{color:var(--mu);font-weight:500}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on)}.chip[aria-pressed=true] small{color:var(--on)}
.hint{margin:4px 2px 0;color:var(--mu);font-size:13px}
.bsm{font-family:var(--ar);font-size:calc(var(--arsize)*.85);text-align:center;padding:14px 0 6px;line-height:2}
.ayat{background:var(--sf);border-radius:var(--r);padding:14px 18px 18px;margin:12px 0;scroll-margin-top:70px;transition:box-shadow .3s}
.ayat.on{box-shadow:0 0 0 2px var(--ac)}
.ah{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.num{min-width:32px;height:32px;padding:0 8px;border-radius:16px;background:color-mix(in srgb,var(--ac) 16%,transparent);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ac)}
.pill{height:34px;padding:0 16px;border:0;border-radius:17px;background:var(--sf2);font-weight:600;font-size:14px;color:var(--ac)}
.pill:active,.chip:active{transform:scale(.96)}
.ayat.on .pill{background:var(--ac);color:var(--on)}
.arab{font-family:var(--ar);font-weight:700;font-size:var(--arsize);line-height:2.35;text-align:right;direction:rtl;word-spacing:.08em;margin:0}
.arab i{font-style:normal;cursor:pointer}
.wq{font-weight:400;color:var(--ac);cursor:pointer;padding:0 .1em}
.lat{margin:10px 0 0;color:var(--ac);font-size:14.5px;font-weight:500}
.idn{margin:6px 0 0;color:var(--mu);font-size:15px}
body.nolat .lat,body.noidn .idn{display:none}
body.notj .arab i{color:inherit!important}
.nav{display:flex;gap:10px;padding-top:12px}.nav .pill{flex:1;height:44px;border-radius:14px}.nav .pill:disabled{opacity:.35}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:var(--gl);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--ln)}
.tabs button{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 0}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ac)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:f .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:8px 22px calc(28px + env(safe-area-inset-bottom));animation:u .3s cubic-bezier(.2,.9,.3,1)}
.sheet:before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.sheet h2{margin:0 0 6px;font-size:21px;letter-spacing:-.01em}
.sheet h3{margin:20px 0 6px;font-size:15px;color:var(--ac)}
.sheet p{margin:6px 0;color:var(--mu)}.sheet p b{color:var(--tx)}
.big{font-family:var(--ar);font-size:46px;line-height:1.8;text-align:center;direction:rtl}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:.5px solid var(--ln)}
.seg{display:flex;gap:2px;background:var(--sf2);padding:2px;border-radius:10px}
.seg button{border:0;border-radius:8px;padding:6px 14px;background:none;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--sf);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]{width:100%;accent-color:var(--ac);margin:8px 0}
.sw{width:51px;height:31px;border-radius:16px;border:0;background:var(--sf2);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.sw[aria-pressed=true]{background:#34C759}.sw[aria-pressed=true]:after{left:22px}
.gl{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--ln)}
.gl .s{font-family:var(--ar);font-size:26px;text-align:center;line-height:1.6}
.gl b{display:block;font-weight:600}.gl span{font-size:13.5px;color:var(--mu)}
.msg{text-align:center;padding:60px 10px;color:var(--mu)}.msg button{margin-top:14px}
.sk{height:90px;border-radius:var(--r);background:var(--sf);margin:14px 0;animation:p 1.2s infinite alternate}
@keyframes u{from{transform:translateY(60px);opacity:0}}@keyframes f{from{opacity:0}}@keyframes p{to{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.arab i{padding:0 .02em}.hit{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:12px}.big{font-weight:700;line-height:2.1}.acts{display:flex;gap:8px}.sel{height:34px;border:0;border-radius:10px;background:var(--sf2);padding:0 10px;font-size:14px}.lat{font-size:15.5px}
.an{display:inline-grid;place-items:center;position:relative;min-width:1.6em;height:1.6em;padding:0 .2em;margin:0 .2em;border:.07em solid var(--ac);border-radius:50%;font-size:.52em;line-height:1;color:var(--ac);direction:ltr}.an sup{position:absolute;top:-1.15em;left:-.35em;font-size:1em;color:var(--ac)}.an .sj{left:auto;right:-.5em}.rk{margin-top:12px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-size:13.5px;font-weight:600}
</style>
</head>
<body>
<div id="bar" class="bar"></div>
<main id="app" class="wrap"></main>
<nav class="tabs"><button data-h="#/"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5V19"/></svg>Qur’an</button><button data-h="#/tajwid"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Tajwid</button><button data-a="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Setelan</button></nav>
<script>
(function(){
'use strict';
const $=(s,e)=>(e||document).querySelector(s);
const app=$('#app'),barEl=$('#bar');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const st={get(k,d){try{const v=localStorage.getItem('zq:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zq:'+k,JSON.stringify(v))}catch(e){}}};
const QR=[['01','Abdullah Al-Juhany'],['02','Abdul Muhsin Al-Qasim'],['03','Abdurrahman as-Sudais'],['04','Ibrahim Al-Dossari'],['05','Misyari Rasyid Al-Afasi']];
const cfg=Object.assign({theme:'midnight',size:42,qari:'05',rukuStop:false,tajwid:true,latin:true,terjemah:true},st.get('cfg',{}));

/* ---------- referensi: tajwid & waqaf ---------- */
const TJ=[
['madda_normal','Mad Thabi’i','#4DA3FF','Huruf mad tanpa hamzah atau sukun sesudahnya.','Dibaca panjang 2 harakat.'],
['madda_permissible','Mad Jaiz','#4DA3FF','Mad Munfashil, atau mad ‘Aridh Lissukun saat berhenti.','Boleh 2, 4, atau 5 harakat (‘Aridh: 2, 4, atau 6).'],
['madda_obligatory','Mad Wajib Muttashil','#2F7BFF','Mad thabi’i bertemu hamzah dalam satu kata.','Wajib dibaca panjang 4–5 harakat.'],
['madda_necessary','Mad Lazim','#6C5CE7','Huruf mad bertemu sukun asli atau tasydid dalam satu kata.','Dibaca panjang 6 harakat.'],
['qalaqah','Qalqalah','#E8A317','Huruf ق ط ب ج د yang sukun.','Dibunyikan memantul.'],
['ikhfa','Ikhfa Haqiqi','#E5604D','Nun sukun atau tanwin bertemu salah satu dari 15 huruf ikhfa.','Dibaca samar dengan dengung sekitar 2 harakat.'],
['ikhfa_shafawi','Ikhfa Syafawi','#E5604D','Mim sukun bertemu ba.','Dibaca samar dengan dengung, bibir dirapatkan ringan.'],
['iqlab','Iqlab','#D94FA6','Nun sukun atau tanwin bertemu ba.','Bunyi nun diganti mim, didengungkan sekitar 2 harakat.'],
['idgham_ghunnah','Idgham Bighunnah','#2FBF71','Nun sukun atau tanwin bertemu ya, nun, mim, atau wau di kata berikutnya.','Dilebur dengan dengung sekitar 2 harakat.'],
['idgham_wo_ghunnah','Idgham Bilaghunnah','#8A939B','Nun sukun atau tanwin bertemu lam atau ra.','Dilebur tanpa dengung.'],
['idgham_shafawi','Idgham Mimi','#2FBF71','Mim sukun bertemu mim.','Dilebur dengan dengung sekitar 2 harakat.'],
['idgham_mutajanisayn','Idgham Mutajanisain','#2FBF71','Dua huruf satu makhraj dengan sifat berbeda; yang pertama sukun.','Huruf pertama dilebur ke huruf kedua.'],
['idgham_mutaqaribayn','Idgham Mutaqaribain','#2FBF71','Dua huruf yang makhrajnya berdekatan; yang pertama sukun.','Huruf pertama dilebur ke huruf kedua.'],
['ghunnah','Ghunnah','#F0883E','Nun atau mim bertasydid.','Didengungkan sekitar 2 harakat.'],
['laam_shamsiyah','Lam Syamsiyah','#8A939B','Lam pada “al” bertemu huruf syamsiyah.','Lam tidak dibaca; huruf sesudahnya bertasydid.'],
['ham_wasl','Hamzah Wasal','#8A939B','Alif di awal kata yang hanya dibaca saat memulai.','Hilang saat disambung dengan kata sebelumnya.'],
['slnt','Huruf tidak dibaca','#8A939B','Ditulis tetapi tidak dilafalkan.','Lewati huruf ini saat membaca.']
];
const TJM={};TJ.forEach(t=>TJM[t[0]]=t);
const css=document.createElement('style');
css.textContent=TJ.map(t=>'.t-'+t[0]+'{color:'+t[2]+'}[data-theme=midnight] .t-'+t[0]+'{color:color-mix(in srgb,'+t[2]+' 62%,#fff)}#app[data-hl='+t[0]+'] i.tj:not(.t-'+t[0]+'){color:var(--tx);opacity:.3}').join('');
document.head.appendChild(css);
const WQ={
'\u06D8':['م','Waqaf Lazim','Wajib berhenti. Jika disambung, makna bisa berubah.'],
'\u06D9':['لا','Laa (jangan berhenti)','Jangan berhenti di sini; sambung ke kata berikutnya.'],
'\u06DA':['ج','Waqaf Ja’iz','Boleh berhenti atau melanjutkan, sama baiknya.'],
'\u06D6':['صلى','Al-Washlu Awla','Lebih utama disambung, tetapi boleh berhenti.'],
'\u06D7':['قلى','Al-Waqfu Awla','Lebih utama berhenti, tetapi boleh disambung.'],
'\u06DB':['ۛ  ۛ','Mu’anaqah','Tanda berpasangan. Berhenti di salah satunya, bukan keduanya.'],
'\u06DC':['س','Saktah','Berhenti sejenak tanpa mengambil napas, lalu lanjut.']
};

/* ---------- data ---------- */
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function loadList(){
 const c=st.get('list');if(c)return c;
 const j=await getJSON('https://equran.id/api/v2/surat');
 st.set('list',j.data);return j.data;
}
async function loadSurah(n){
 const c=st.get('v3s'+n);if(c)return c;
 const [a,t,rk]=await Promise.all([
  getJSON('https://equran.id/api/v2/surat/'+n),
  getJSON('https://api.quran.com/api/v4/quran/verses/uthmani_tajweed?chapter_number='+n+'&per_page=300').catch(()=>null),
  getJSON('https://api.quran.com/api/v4/verses/by_chapter/'+n+'?per_page=300').catch(()=>null)
 ]);
 const d=a.data,tv=(t&&t.verses)||[],rv=(rk&&rk.verses)||[];
 const out={nomor:d.nomor,namaLatin:d.namaLatin,nama:d.nama,arti:d.arti,jumlahAyat:d.jumlahAyat,
  ayat:d.ayat.map((x,i)=>({n:x.nomorAyat,ar:x.teksArab,lat:x.teksLatin,id:x.teksIndonesia,
   re:rv.length===d.ayat.length&&rv[i].ruku_number!==(rv[i+1]&&rv[i+1].ruku_number),sj:!!(rv[i]&&rv[i].sajdah_type),aus:x.audio||{},au:(x.audio&&(x.audio['05']||Object.values(x.audio)[0]))||'',tj:(tv[i]&&tv[i].text_uthmani_tajweed)||''}))};
 if(tv.length===out.ayat.length&&rv.length===out.ayat.length)st.set('v3s'+n,out);
 return out;
}
function arHTML(raw,useTj){
 let s=String(raw);
 if(useTj)s=s.replace(/<tajweed class=([a-z_]+)>/g,'<i class="tj t-$1">').replace(/<\/tajweed>/g,'</i>').replace(/<span class=end>[^<]*<\/span>/g,'');
 return s.split(/(<[^>]*>)/).map(p=>{
  if(p.charAt(0)==='<')return /^<\/i>$|^<i class="tj t-[a-z_]+">$/.test(p)?p:'';
  return esc(p).replace(/[\u06D6-\u06DC]/g,c=>'<b class="wq" data-w="'+c+'">'+c+'</b>');
 }).join('');
}

/* ---------- UI helpers ---------- */
if(!st.get('v2')){cfg.size=Math.max(cfg.size,42);st.set('v2',1)}
function applyCfg(){
 document.documentElement.dataset.theme=cfg.theme;
 document.documentElement.style.setProperty('--arsize',cfg.size+'px');
 $('#tc').content=cfg.theme==='midnight'?'#000000':'#F2F2F7';
 document.body.classList.toggle('notj',!cfg.tajwid);
 document.body.classList.toggle('nolat',!cfg.latin);
 document.body.classList.toggle('noidn',!cfg.terjemah);
 st.set('cfg',cfg);
}
function closeSheet(){const s=$('#sh');if(s)s.remove()}
function sheet(html){
 closeSheet();
 const d=document.createElement('div');d.id='sh';
 d.innerHTML='<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
 document.body.appendChild(d);
 $('.scrim',d).onclick=closeSheet;
 return d;
}
function setBar(title,back,large){
 barEl.className='bar'+(large?' lg':'');
 barEl.innerHTML=large?'<div class="lt">'+esc(title)+'</div>':'<div class="in"><button class="bk" data-a="back">‹ Kembali</button><h1>'+esc(title)+'</h1><button class="tb" data-a="guide">Panduan</button></div>';
}
function openSettings(){
 const sw=(k,l)=>'<div class="set"><span>'+l+'</span><button class="sw" data-k="'+k+'" aria-pressed="'+cfg[k]+'" aria-label="'+l+'"></button></div>';
 const d=sheet('<h2>Pengaturan</h2>'+
  '<div class="set"><span>Tema</span><div class="seg"><button data-th="midnight" aria-pressed="'+(cfg.theme==='midnight')+'">Gelap</button><button data-th="emerald" aria-pressed="'+(cfg.theme==='emerald')+'">Terang</button></div></div>'+
  '<div style="padding:12px 0"><div class="set" style="border:0;padding:0"><span>Ukuran teks Arab</span><b id="szv">'+cfg.size+'</b></div>'+
  '<input type="range" id="sz" min="24" max="72" step="2" value="'+cfg.size+'" aria-label="Ukuran teks Arab"></div>'+
  sw('tajwid','Warna tajwid')+sw('latin','Teks latin')+sw('terjemah','Terjemahan')+sw('rukuStop','Berhenti otomatis di akhir ruku’')+'<div class="set"><span>Qari</span><select id="qr" class="sel">'+QR.map(q=>'<option value="'+q[0]+'"'+(cfg.qari===q[0]?' selected':'')+'>'+q[1]+'</option>').join('')+'</select></div>');
 d.onclick=e=>{
  const th=e.target.closest('[data-th]'),k=e.target.closest('[data-k]');
  if(th){cfg.theme=th.dataset.th;applyCfg();d.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b===th))}
  if(k){cfg[k.dataset.k]=!cfg[k.dataset.k];k.setAttribute('aria-pressed',cfg[k.dataset.k]);applyCfg()}
 };
 $('#sz',d).oninput=e=>{cfg.size=+e.target.value;$('#szv',d).textContent=cfg.size;applyCfg()};
 $('#qr',d).onchange=e=>{cfg.qari=e.target.value;applyCfg()};
}
function openGuide(){
 const wq=Object.keys(WQ).map(c=>'<div class="gl"><div class="s">'+c+'</div><div><b>'+WQ[c][0]+' · '+WQ[c][1]+'</b><span>'+WQ[c][2]+'</span></div></div>').join('');
 const tj=TJ.map(t=>'<div class="gl"><div class="s" style="color:'+t[2]+'">●</div><div><b>'+t[1]+'</b><span>'+t[3]+' '+t[4]+'</span></div></div>').join('');
 sheet('<h2>Panduan baca</h2><p>Ketuk huruf berwarna atau tanda waqaf di ayat untuk melihat penjelasannya.</p><h3>Tanda waqaf</h3>'+wq+'<h3>Hukum tajwid</h3>'+tj);
}
function wordOf(el){
 const p=el.closest('.arab');let w=[''],hit=-1;
 p.childNodes.forEach(n=>{
  if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(x=>{if(!x)return;if(/^\s+$/.test(x))w.push('');else w[w.length-1]+=esc(x)})}
  else{if(n===el||n.contains(el))hit=w.length-1;w[w.length-1]+=n.outerHTML}
 });
 return (w[hit]||el.outerHTML).replace(el.outerHTML,'<u class="hit">'+el.outerHTML+'</u>');
}
function showTj(el){
 const m=el.className.match(/t-([a-z_]+)/),t=m&&TJM[m[1]];if(!t)return;
 const sec=el.closest('.ayat');
 sheet('<div class="big" dir="rtl" lang="ar">'+wordOf(el)+'</div><h2 style="color:'+t[2]+'">'+t[1]+'</h2><p>'+t[3]+'</p><p><b>Cara baca:</b> '+t[4]+'</p><div class="chips"><button class="chip" data-hlk="'+m[1]+'">Sorot semua hukum ini</button>'+(sec?'<button class="chip" data-playi="'+sec.dataset.i+'">▶ Putar ayat</button>':'')+'</div>');
}
function isBm(s,a){return st.get('bm',[]).some(x=>x.s===s&&x.a===a)}
function toggleBm(s,name,a){let b=st.get('bm',[]);b=isBm(s,a)?b.filter(x=>!(x.s===s&&x.a===a)):b.concat([{s,name,a}]);st.set('bm',b)}
function bmHTML(){const b=st.get('bm',[]);if(!b.length)return '';return '<p class="hint" style="margin:0 6px 6px">Ayat tersimpan</p><div class="grp">'+b.map(x=>'<button class="row cv" data-h="#/s/'+x.s+'/'+x.a+'"><span class="no">★</span><span><b>'+esc(x.name)+'</b><small>Ayat '+x.a+'</small></span><span></span></button>').join('')+'</div>'}
function showWq(c){
 const w=WQ[c];if(!w)return;
 sheet('<div class="big" style="color:var(--ac)">'+c+'</div><h2>'+w[0]+' · '+w[1]+'</h2><p>'+w[2]+'</p>');
}

/* ---------- pembaca ---------- */
const audio=new Audio();audio.preload='none';
let S=null,cur=-1,obs=null,lastI=0,mcOn=false;
const MC=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorMusicControls;
function notif(i,pl){
 if(!S||!S.ayat[i])return;
 const tr=S.namaLatin+' · Ayat '+S.ayat[i].n,ar=(QR.find(q=>q[0]===cfg.qari)||[0,''])[1];
 try{if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:tr,artist:ar,album:'Zann Qur’an'});
  navigator.mediaSession.playbackState=pl?'playing':'paused';
  [['play',()=>audio.play()],['pause',()=>audio.pause()],['previoustrack',()=>play(Math.max(0,lastI-1))],['nexttrack',()=>play(Math.min(S.ayat.length-1,lastI+1))]].forEach(a=>{try{navigator.mediaSession.setActionHandler(a[0],a[1])}catch(e){}});
 }}catch(e){}
 const p=MC();if(!p)return;
 p.create({track:tr,artist:ar,album:'Zann Qur’an',cover:'',isPlaying:pl,dismissable:false,hasPrev:i>0,hasNext:i<S.ayat.length-1,hasClose:true,ticker:tr}).then(()=>{mcOn=true}).catch(()=>{});
}
function mcDestroy(){const p=MC();if(p&&mcOn){try{p.destroy();}catch(e){}mcOn=false}}
function mcEvent(e){
 const m=e&&(e.message||(e.detail&&e.detail.message));
 if(m==='music-controls-pause')audio.pause();
 else if(m==='music-controls-play')audio.play().catch(()=>{});
 else if(m==='music-controls-next')play(Math.min(S.ayat.length-1,lastI+1));
 else if(m==='music-controls-previous')play(Math.max(0,lastI-1));
 else if(m==='music-controls-destroy'){audio.pause();mcOn=false}
}
document.addEventListener('controlsNotification',mcEvent);
setTimeout(()=>{const p=MC();if(p&&p.addListener)try{p.addListener('controlsNotification',mcEvent)}catch(e){}},800);
audio.addEventListener('play',()=>{const p=MC();if(p&&mcOn)try{p.updateIsPlaying({isPlaying:true})}catch(e){}if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
audio.addEventListener('pause',()=>{const p=MC();if(p&&mcOn)try{p.updateIsPlaying({isPlaying:false})}catch(e){}if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
function setPlaying(i){
 cur=i;
 document.querySelectorAll('.ayat').forEach(e=>{
  const on=+e.dataset.i===i;e.classList.toggle('on',on);
  const b=$('[data-play]',e);if(b)b.textContent=on?'Jeda':'Putar';
 });
}
function play(i){
 const a=S.ayat[i];if(!a||!a.au)return;
 if(cur===i&&!audio.paused){audio.pause();setPlaying(-1);return}
 audio.src=(a.aus&&a.aus[cfg.qari])||a.au;
 audio.play().then(()=>{setPlaying(i);lastI=i;notif(i,true);const el=$('#a'+a.n);if(el)el.scrollIntoView({block:'center'})}).catch(()=>{setPlaying(-1)});
}
audio.onended=()=>{if(S&&cur>=0&&cur+1<S.ayat.length&&!(cfg.rukuStop&&S.ayat[cur].re))play(cur+1);else{setPlaying(-1);mcDestroy()}};
audio.onerror=()=>setPlaying(-1);

async function viewSurah(n,a){
 audio.pause();setPlaying(-1);
 if(obs)obs.disconnect();
 app.dataset.hl='';setBar('Memuat…',true);
 app.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 try{S=await loadSurah(n)}catch(e){
  app.innerHTML='<div class="msg">Surah gagal dimuat. Periksa koneksi internet.<br><button class="pill" data-a="retry">Coba lagi</button></div>';return}
 setBar(S.namaLatin,true);
 const hasTj=S.ayat.some(x=>x.tj);
 const bsm=(S.nomor!==1&&S.nomor!==9)?'<div class="bsm" dir="rtl" lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>':'';
 app.innerHTML='<div class="hero"><div class="ar" lang="ar">'+esc(S.nama)+'</div><p>'+esc(S.arti)+' · '+S.jumlahAyat+' ayat</p></div>'+legend(S)+bsm+
  S.ayat.map((x,i)=>'<section class="ayat" id="a'+x.n+'" data-i="'+i+'" data-n="'+x.n+'"><div class="ah"><span class="num">'+x.n+'</span>'+
   '<span class="acts"><button class="pill" data-bm="'+x.n+'">'+(isBm(S.nomor,x.n)?'★':'☆')+'</button>'+(x.au?'<button class="pill" data-play="'+i+'">Putar</button>':'')+'</span>'+'</div>'+
   '<p class="arab" dir="rtl" lang="ar">'+arHTML(hasTj&&x.tj?x.tj:x.ar,hasTj&&x.tj)+' <span class="an">'+arNum(x.n)+(x.re?'<sup>ع</sup>':'')+(x.sj?'<sup class="sj">۩</sup>':'')+'</span></p>'+
   '<p class="lat">'+esc(x.lat)+'</p><p class="idn">'+esc(x.id)+'</p>'+(x.re?'<div class="rk">ع Akhir ruku’ — di sini boleh berhenti</div>':'')+(x.sj?'<div class="rk">۩ Ayat sajdah</div>':'')+'</section>').join('')+
  '<div class="nav"><button class="pill" data-h="#/s/'+(n-1)+'"'+(n<=1?' disabled':'')+'>← Sebelumnya</button><button class="pill" data-h="#/s/'+(n+1)+'"'+(n>=114?' disabled':'')+'>Berikutnya →</button></div>';
 if(a&&$('#a'+a)){$('#a'+a).scrollIntoView({block:'start'})}else window.scrollTo(0,0);
 // bookmark otomatis: ayat yang sedang berada di area baca
 obs=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting)st.set('last',{s:S.nomor,name:S.namaLatin,a:+e.target.dataset.n})});
 },{rootMargin:'-20% 0px -65% 0px'});
 document.querySelectorAll('.ayat').forEach(e=>obs.observe(e));
}

/* ---------- aksi & router ---------- */
document.addEventListener('click',e=>{
 const t=e.target;
 const h=t.closest('[data-h]');if(h&&!h.disabled){location.hash=h.dataset.h;return}
 const p=t.closest('[data-play]');if(p){play(+p.dataset.play);return}
 const tj=t.closest('i.tj');if(tj){showTj(tj);return}
 const wq=t.closest('b.wq');if(wq){showWq(wq.dataset.w);return}
 const hk=t.closest('[data-hlk]');if(hk){closeSheet();app.dataset.hl=hk.dataset.hlk;document.querySelectorAll('[data-chip]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.chip===hk.dataset.hlk));return}
 const pi=t.closest('[data-playi]');if(pi){closeSheet();play(+pi.dataset.playi);return}
 const bm=t.closest('[data-bm]');if(bm){toggleBm(S.nomor,S.namaLatin,+bm.dataset.bm);bm.textContent=isBm(S.nomor,+bm.dataset.bm)?'★':'☆';return}
 const ti=t.closest('[data-t]');if(ti){showHukum(ti.dataset.t);return}
 const tg=t.closest('[data-tg]');if(tg){cfg[tg.dataset.tg]=!cfg[tg.dataset.tg];tg.setAttribute('aria-pressed',cfg[tg.dataset.tg]);applyCfg();return}
 const cp=t.closest('[data-chip]');if(cp){const k=cp.dataset.chip,on=app.dataset.hl!==k;app.dataset.hl=on?k:'';document.querySelectorAll('[data-chip]').forEach(b=>b.setAttribute('aria-pressed',on&&b===cp));return}
 const ac=t.closest('[data-a]');if(!ac)return;
 const a=ac.dataset.a;
 if(a==='back')location.hash=/^#\/tajwid\/\d/.test(location.hash)?'#/tajwid':'#/';
 else if(a==='set')openSettings();
 else if(a==='guide')openGuide();
 else if(a==='retry')route();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function route(){
 closeSheet();
 const h=location.hash,tj=h.match(/^#\/tajwid(?:\/(\d+))?$/),m=h.match(/^#\/s\/(\d+)(?:\/(\d+))?$/);
