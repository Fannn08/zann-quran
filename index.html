<!DOCTYPE html>
<html lang="id" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10" id="tc">
<title>Zann Qur’an</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@500;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--arsize:42px;--ui:'Inter',-apple-system,system-ui,Roboto,sans-serif;--ar:'Amiri Quran','Scheherazade New','Noto Naskh Arabic',serif;--r:16px}
[data-theme=midnight]{--bg:#132B29;--sf:#1B3A38;--sf2:#244846;--tx:#fff;--mu:#A9BDBA;--ln:rgba(255,255,255,.12);--ac:#4FE3C1;--on:#00302A;--tb:#1FA39D;--lat:#8DDCF4;--pb:#000;color-scheme:dark}
[data-theme=emerald]{--bg:#F3FAF9;--sf:#fff;--sf2:#E3F1EF;--tx:#10201F;--mu:#587370;--ln:rgba(0,60,50,.14);--ac:#0B7F76;--on:#fff;--tb:#1FA39D;--lat:#0A6C98;--pb:#10201F;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--ui)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:var(--tb);padding-top:env(safe-area-inset-top);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.bar .in{max-width:680px;margin:0 auto;height:54px;padding:0 6px;display:flex;align-items:center;gap:2px}
.bar h1{margin:0;font-size:18px;font-weight:600;flex:1;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:none;color:#fff;display:grid;place-items:center;border-radius:12px}
.ib:active{background:rgba(255,255,255,.2)}
.ib svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search{width:100%;height:44px;border:0;border-radius:12px;background:var(--sf);padding:0 14px;margin:14px 0}
.grp{background:var(--sf);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 14px;position:relative}
.row+.row:before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--ln)}
.row:active{background:var(--sf2)}
.row .no{width:38px;height:38px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ac);background:var(--sf2);clip-path:polygon(50% 0,62% 12%,80% 12%,88% 20%,88% 38%,100% 50%,88% 62%,88% 80%,80% 88%,62% 88%,50% 100%,38% 88%,20% 88%,12% 80%,12% 62%,0 50%,12% 38%,12% 20%,20% 12%,38% 12%)}
.row b{display:block;font-weight:600}.row small{color:var(--mu)}
.row .ar{font-family:var(--ar);font-size:26px;font-weight:700;color:var(--ac)}
.row.cv:after{content:"›";color:var(--mu);font-size:26px}
.resume{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:var(--r);background:var(--tb);color:#fff;padding:14px 16px;margin:14px 0}
.resume small{display:block;opacity:.85}.resume .ar{font-family:var(--ar);font-size:28px}
.ban{margin:0 -14px;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;text-align:center;color:var(--mu);font-size:13px;background:radial-gradient(circle at 8% 50%,rgba(200,120,255,.4),transparent 38%),radial-gradient(circle at 92% 50%,rgba(60,230,190,.4),transparent 38%),#0D1D1C}
.ban b{color:#7BE8D2;font-size:20px;font-weight:600}
.bsr{margin:0 -14px;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#0A1514}
.bsr button{width:44px;height:44px;border:0;border-radius:50%;background:#000;color:#9FE;font-size:22px}
.bsr button:disabled{opacity:.3}
.bsm{font-family:var(--ar);font-weight:700;font-size:calc(var(--arsize)*.8);text-align:center;line-height:1.9;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:8px -14px 6px;padding:0 14px}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-radius:17px;background:var(--sf);font-size:14px;font-weight:600;color:var(--mu)}
.chip i{width:10px;height:10px;border-radius:50%}.chip small{font-weight:500}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on)}
.hint{margin:4px 2px 0;color:var(--mu);font-size:13px}
.ayat{padding:16px 0 20px;border-bottom:1px solid var(--ln);scroll-margin-top:62px}
.ayat.on{background:linear-gradient(90deg,transparent,rgba(79,227,193,.12),transparent)}
.ah{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.jh{width:34px;font-size:11px;line-height:1.25;color:var(--mu)}
.hex{position:relative;width:44px;height:44px;display:grid;place-items:center}
.hex svg{position:absolute;inset:0;fill:none;stroke:var(--ac);stroke-width:1.6}
.hex b{font-size:13px;font-weight:700;color:var(--ac)}
.cb{width:28px;height:28px;border-radius:6px;border:2px solid var(--mu);background:#000}
.cb[aria-pressed=true]{background:var(--ac);border-color:var(--ac)}
.cb[aria-pressed=true]:after{content:"✓";color:var(--on);font-weight:800}
.pl{width:34px;height:34px;border-radius:50%;border:0;background:var(--sf2);color:var(--ac);font-size:13px}
.ayat.on .pl{background:var(--ac);color:var(--on)}
.arab{font-family:var(--ar);font-weight:700;font-size:var(--arsize);line-height:2.35;text-align:right;direction:rtl;word-spacing:.08em;margin:0}
.arab i{font-style:normal;cursor:pointer}
.wq{font-weight:400;color:var(--ac);cursor:pointer;padding:0 .1em}
.an{display:inline-grid;place-items:center;position:relative;min-width:1.6em;height:1.6em;padding:0 .2em;margin:0 .2em;border:.07em solid var(--ac);border-radius:50%;font-size:.52em;line-height:1;color:var(--ac);direction:ltr}
.an sup{position:absolute;top:-1.15em;left:-.35em;color:var(--ac)}.an .sj{left:auto;right:-.5em}
.lat{margin:8px 0 0;color:var(--lat);font:500 17px/1.6 ui-monospace,'Courier New',monospace}
.lat u{text-decoration-thickness:2px;text-underline-offset:3px}
.idn{margin:10px 0 0;font-size:19px;line-height:1.7}
.rk{margin-top:12px;padding:9px 12px;border-radius:10px;background:rgba(79,227,193,.14);color:var(--ac);font-size:13.5px;font-weight:600}
body.nolat .lat,body.noidn .idn{display:none}
body.notj .arab i{color:inherit!important}
.pop{position:absolute;left:12px;right:12px;max-width:656px;margin:0 auto;z-index:35}
.pop .pb{background:var(--pb);color:var(--tx);border:3px solid #8E9996;border-radius:12px;padding:14px 16px;font-size:15.5px}
.pop .pb p{margin:6px 0}.pop .pt{color:#3DDC97;font-size:17px}
.pop .ar2{position:absolute;top:-17px;width:0;height:0;border:12px solid transparent;border-bottom-color:#8E9996;border-top:0;margin-top:-4px}
.mp{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0A1514;color:#fff;border-top:1px solid var(--ln)}
.mp[hidden]{display:none}
.mp button{width:42px;height:42px;border:0;border-radius:50%;background:var(--tb);color:#fff;font-size:14px}
.mp .mt{flex:1;min-width:0;padding:0 8px;font-size:13px}.mt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar2{height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:5px}.bar2 i{display:block;height:100%;width:0;border-radius:2px;background:#4FE3C1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--sf);border-radius:24px 24px 0 0;padding:8px 20px calc(26px + env(safe-area-inset-bottom));animation:u .25s}
.sheet:before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.sheet h2{margin:0 0 6px;font-size:20px}.sheet h3{margin:18px 0 6px;font-size:15px;color:var(--ac)}.sheet p{margin:6px 0;color:var(--mu)}
.big{font-family:var(--ar);font-weight:700;font-size:46px;line-height:2;text-align:center;direction:rtl}
.hit{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:12px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.seg{display:flex;gap:2px;background:var(--sf2);padding:2px;border-radius:10px}
.seg button{border:0;border-radius:8px;padding:6px 14px;background:none;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--on)}
.sel{height:34px;border:0;border-radius:10px;background:var(--sf2);padding:0 10px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--ac)}
.sw{width:51px;height:31px;border-radius:16px;border:0;background:var(--sf2);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-pressed=true]{background:#34C759}.sw[aria-pressed=true]:after{left:22px}
.gl{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.gl .s{font-family:var(--ar);font-size:26px;text-align:center}.gl b{display:block}.gl span{font-size:13.5px;color:var(--mu)}
.msg{text-align:center;padding:60px 10px;color:var(--mu)}
.pill{height:34px;padding:0 16px;border:0;border-radius:17px;background:var(--sf2);font-weight:600;color:var(--ac)}
.sk{height:90px;border-radius:var(--r);background:var(--sf);margin:14px 0;animation:p 1.2s infinite alternate}
@keyframes u{from{transform:translateY(50px);opacity:0}}@keyframes p{to{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.arab{font-weight:400;-webkit-text-stroke:.55px currentColor;line-height:2.3}
.ayat{padding:10px 0 18px}
.hex{border:0;background:none;padding:0;color:inherit;cursor:pointer}.hex.on svg{fill:rgba(79,227,193,.3)}
.lat{font:600 18px/1.65 'Roboto Mono',ui-monospace,monospace;margin-top:4px}
.wb{display:inline-flex;align-items:flex-start;gap:2px;vertical-align:middle;margin:0 .25em;padding:0;-webkit-text-stroke:0;font-weight:400;direction:ltr}
.wb s{font-family:var(--ar);font-size:24px;text-decoration:none;line-height:1}
.wb em{writing-mode:vertical-rl;font:600 11px/1 var(--ui);font-style:normal;letter-spacing:.08em;padding:5px 2px;border:1.5px solid;white-space:nowrap}
.wb .j{color:#F2E96B}.wb .t{color:#C98EE8}
.ara{font-family:var(--ar);color:#3DDC97;-webkit-text-stroke:.3px #3DDC97}
.mp{padding:6px 10px calc(6px + env(safe-area-inset-bottom))}.mp button{width:38px;height:38px}
</style>
</head>
<body>
<div id="bar" class="bar"></div>
<main id="app" class="wrap"></main>
<div id="mp" class="mp" hidden><button data-mp="prev" aria-label="Ayat sebelumnya">⏮</button><button data-mp="toggle" id="mpt" aria-label="Putar atau jeda">▶</button><button data-mp="next" aria-label="Ayat berikutnya">⏭</button><div class="mt"><span id="mpl"></span><div class="bar2"><i id="mpb"></i></div></div><span id="mpx" style="font-size:12px">0:00</span></div>
<script>
(function(){
'use strict';
const $=(s,e)=>(e||document).querySelector(s);
const app=$('#app'),barEl=$('#bar');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const st={get(k,d){try{const v=localStorage.getItem('zq:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zq:'+k,JSON.stringify(v))}catch(e){}}};
const QR=[['01','Abdullah Al-Juhany'],['02','Abdul Muhsin Al-Qasim'],['03','Abdurrahman as-Sudais'],['04','Ibrahim Al-Dossari'],['05','Misyari Rasyid Al-Afasi']];
const WL={'\u06D8':['JEDA','j'],'\u06D9':['TERUS','t'],'\u06DA':['JEDA | TR','j'],'\u06D6':['TR > JD','t'],'\u06D7':['JD > TR','j'],'\u06DB':['JD ۛ JD','t'],'\u06DC':['SAKTAH','j']};
const ARN={madda_normal:'مَدٌّ طَبِيعِيٌّ',madda_permissible:'مَدٌّ جَائِزٌ مُنْفَصِلٌ',madda_obligatory:'مَدٌّ وَاجِبٌ مُتَّصِلٌ',madda_necessary:'مَدٌّ لَازِمٌ',qalaqah:'قَلْقَلَةٌ',ikhfa:'إِخْفَاءٌ حَقِيقِيٌّ',ikhfa_shafawi:'إِخْفَاءٌ شَفَوِيٌّ',iqlab:'إِقْلَابٌ',idgham_ghunnah:'إِدْغَامٌ بِغُنَّةٍ',idgham_wo_ghunnah:'إِدْغَامٌ بِلَا غُنَّةٍ',idgham_shafawi:'إِدْغَامٌ شَفَوِيٌّ',idgham_mutajanisayn:'إِدْغَامٌ مُتَجَانِسَيْنِ',idgham_mutaqaribayn:'إِدْغَامٌ مُتَقَارِبَيْنِ',ghunnah:'غُنَّةٌ',laam_shamsiyah:'لَامٌ شَمْسِيَّةٌ',ham_wasl:'هَمْزَةُ الْوَصْلِ',slnt:'حَرْفٌ لَا يُنْطَقُ'};
const cfg=Object.assign({theme:'midnight',size:34,qari:'05',rukuStop:false,tajwid:true,latin:true,terjemah:true},st.get('cfg',{}));

/* ---------- referensi: tajwid & waqaf ---------- */
const TJ=[
['madda_normal','Mad Thabi’i','#4DA3FF','Huruf mad tanpa hamzah atau sukun sesudahnya.','Dibaca panjang 2 harakat.'],
['madda_permissible','Mad Jaiz','#4DA3FF','Mad Munfashil, atau mad ‘Aridh Lissukun saat berhenti.','Boleh 2, 4, atau 5 harakat (‘Aridh: 2, 4, atau 6).'],
['madda_obligatory','Mad Wajib Muttashil','#2F7BFF','Mad thabi’i bertemu hamzah dalam satu kata.','Wajib dibaca panjang 4–5 harakat.'],
['madda_necessary','Mad Lazim','#6C5CE7','Huruf mad bertemu sukun asli atau tasydid dalam satu kata.','Dibaca panjang 6 harakat.'],
['qalaqah','Qalqalah','#E8A317','Huruf ق ط ب ج د yang sukun.','Dibunyikan memantul.'],
['ikhfa','Ikhfa Haqiqi','#E5604D','Nun sukun atau tanwin bertemu salah satu dari 15 huruf ikhfa.','Dibaca samar dengan dengung sekitar 2 harakat.'],
['ikhfa_shafawi','Ikhfa Syafawi','#E5604D','Mim sukun bertemu ba.','Dibaca samar dengan dengung, bibir dirapatkan ringan.'],
['iqlab','Iqlab','#D94FA6','Nun sukun atau tanwin bertemu ba.','Bunyi nun diganti mim, didengungkan sekitar 2 harakat.'],
['idgham_ghunnah','Idgham Bighunnah','#2FBF71','Nun sukun atau tanwin bertemu ya, nun, mim, atau wau di kata berikutnya.','Dilebur dengan dengung sekitar 2 harakat.'],
['idgham_wo_ghunnah','Idgham Bilaghunnah','#8A939B','Nun sukun atau tanwin bertemu lam atau ra.','Dilebur tanpa dengung.'],
['idgham_shafawi','Idgham Mimi','#2FBF71','Mim sukun bertemu mim.','Dilebur dengan dengung sekitar 2 harakat.'],
['idgham_mutajanisayn','Idgham Mutajanisain','#2FBF71','Dua huruf satu makhraj dengan sifat berbeda; yang pertama sukun.','Huruf pertama dilebur ke huruf kedua.'],
['idgham_mutaqaribayn','Idgham Mutaqaribain','#2FBF71','Dua huruf yang makhrajnya berdekatan; yang pertama sukun.','Huruf pertama dilebur ke huruf kedua.'],
['ghunnah','Ghunnah','#F0883E','Nun atau mim bertasydid.','Didengungkan sekitar 2 harakat.'],
['laam_shamsiyah','Lam Syamsiyah','#8A939B','Lam pada “al” bertemu huruf syamsiyah.','Lam tidak dibaca; huruf sesudahnya bertasydid.'],
['ham_wasl','Hamzah Wasal','#8A939B','Alif di awal kata yang hanya dibaca saat memulai.','Hilang saat disambung dengan kata sebelumnya.'],
['slnt','Huruf tidak dibaca','#8A939B','Ditulis tetapi tidak dilafalkan.','Lewati huruf ini saat membaca.']
];
const TJM={};TJ.forEach(t=>TJM[t[0]]=t);
const css=document.createElement('style');
css.textContent=TJ.map(t=>'.t-'+t[0]+'{color:'+t[2]+'}[data-theme=midnight] .t-'+t[0]+'{color:color-mix(in srgb,'+t[2]+' 62%,#fff)}#app[data-hl='+t[0]+'] i.tj:not(.t-'+t[0]+'){color:var(--tx);opacity:.3}').join('');
document.head.appendChild(css);
const WQ={
'\u06D8':['م','Waqaf Lazim','Wajib berhenti. Jika disambung, makna bisa berubah.'],
'\u06D9':['لا','Laa (jangan berhenti)','Jangan berhenti di sini; sambung ke kata berikutnya.'],
'\u06DA':['ج','Waqaf Ja’iz','Boleh berhenti atau melanjutkan, sama baiknya.'],
'\u06D6':['صلى','Al-Washlu Awla','Lebih utama disambung, tetapi boleh berhenti.'],
'\u06D7':['قلى','Al-Waqfu Awla','Lebih utama berhenti, tetapi boleh disambung.'],
'\u06DB':['ۛ  ۛ','Mu’anaqah','Tanda berpasangan. Berhenti di salah satunya, bukan keduanya.'],
'\u06DC':['س','Saktah','Berhenti sejenak tanpa mengambil napas, lalu lanjut.']
};

/* ---------- data ---------- */
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function loadList(){
 const c=st.get('list');if(c)return c;
 const j=await getJSON('https://equran.id/api/v2/surat');
 st.set('list',j.data);return j.data;
}
async function loadSurah(n){
 const c=st.get('v4s'+n);if(c)return c;
 const [a,t,rk]=await Promise.all([
  getJSON('https://equran.id/api/v2/surat/'+n),
  getJSON('https://api.quran.com/api/v4/quran/verses/uthmani_tajweed?chapter_number='+n+'&per_page=300').catch(()=>null),
  getJSON('https://api.quran.com/api/v4/verses/by_chapter/'+n+'?per_page=300').catch(()=>null)
 ]);
 const d=a.data,tv=(t&&t.verses)||[],rv=(rk&&rk.verses)||[];
 const out={nomor:d.nomor,namaLatin:d.namaLatin,nama:d.nama,arti:d.arti,jumlahAyat:d.jumlahAyat,tempat:d.tempatTurun,
  ayat:d.ayat.map((x,i)=>({n:x.nomorAyat,ar:x.teksArab,lat:x.teksLatin,id:x.teksIndonesia,
   j:rv[i]&&rv[i].juz_number,pg:rv[i]&&rv[i].page_number,re:rv.length===d.ayat.length&&rv[i].ruku_number!==(rv[i+1]&&rv[i+1].ruku_number),sj:!!(rv[i]&&rv[i].sajdah_type),aus:x.audio||{},au:(x.audio&&(x.audio['05']||Object.values(x.audio)[0]))||'',tj:(tv[i]&&tv[i].text_uthmani_tajweed)||''}))};
 if(tv.length===out.ayat.length&&rv.length===out.ayat.length)st.set('v4s'+n,out);
 return out;
}
function arHTML(raw,useTj){
 let s=String(raw);
 if(useTj)s=s.replace(/<tajweed class=([a-z_]+)>/g,'<i class="tj t-$1">').replace(/<\/tajweed>/g,'</i>').replace(/<span class=end>[^<]*<\/span>/g,'');
 return s.split(/(<[^>]*>)/).map(p=>{
  if(p.charAt(0)==='<')return /^<\/i>$|^<i class="tj t-[a-z_]+">$/.test(p)?p:'';
  return esc(p).replace(/[\u06D6-\u06DC]/g,c=>'<b class="wq wb" data-w="'+c+'"><s class="'+WL[c][1]+'">'+c+'</s><em class="'+WL[c][1]+'">'+WL[c][0]+'</em></b>');
 }).join('');
}

/* ---------- UI helpers ---------- */
if(!st.get('v2')){cfg.size=Math.max(cfg.size,42);st.set('v2',1)}
if(!st.get('v3')){cfg.size=34;st.set('v3',1)}
function applyCfg(){
 document.documentElement.dataset.theme=cfg.theme;
 document.documentElement.style.setProperty('--arsize',cfg.size+'px');

function wordOf(el){
 const p=el.closest('.arab');let w=[''],hit=-1;
 p.childNodes.forEach(n=>{
  if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(x=>{if(!x)return;if(/^\s+$/.test(x))w.push('');else w[w.length-1]+=esc(x)})}
  else{if(n===el||n.contains(el))hit=w.length-1;w[w.length-1]+=n.outerHTML}
 });
 return (w[hit]||el.outerHTML).replace(el.outerHTML,'<u class="hit">'+el.outerHTML+'</u>');
}

const audio=new Audio();audio.preload='none';
let S=null,cur=-1,obs=null,lastI=0,mcOn=false;
const MC=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorMusicControls;
function notif(i,pl){
 if(!S||!S.ayat[i])return;
 const tr=S.namaLatin+' · Ayat '+S.ayat[i].n,ar=(QR.find(q=>q[0]===cfg.qari)||[0,''])[1];
 try{if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:tr,artist:ar,album:'Zann Qur’an'});
  navigator.mediaSession.playbackState=pl?'playing':'paused';
  [['play',()=>audio.play()],['pause',()=>audio.pause()],['previoustrack',()=>play(Math.max(0,lastI-1))],['nexttrack',()=>play(Math.min(S.ayat.length-1,lastI+1))]].forEach(a=>{try{navigator.mediaSession.setActionHandler(a[0],a[1])}catch(e){}});
 }}catch(e){}
 const p=MC();if(!p)return;
 p.create({track:tr,artist:ar,album:'Zann Qur’an',cover:'',isPlaying:pl,dismissable:false,hasPrev:i>0,hasNext:i<S.ayat.length-1,hasClose:true,ticker:tr}).then(()=>{mcOn=true}).catch(()=>{});
}
function mcDestroy(){const p=MC();if(p&&mcOn){try{p.destroy();}catch(e){}mcOn=false}}
function mcEvent(e){
 const m=e&&(e.message||(e.detail&&e.detail.message));
 if(m==='music-controls-pause')audio.pause();
 else if(m==='music-controls-play')audio.play().catch(()=>{});
 else if(m==='music-controls-next')play(Math.min(S.ayat.length-1,lastI+1));
 else if(m==='music-controls-previous')play(Math.max(0,lastI-1));
 else if(m==='music-controls-destroy'){audio.pause();mcOn=false}
}
document.addEventListener('controlsNotification',mcEvent);
setTimeout(()=>{const p=MC();if(p&&p.addListener)try{p.addListener('controlsNotification',mcEvent)}catch(e){}},800);
audio.addEventListener('timeupdate',()=>{const b=$('#mpb');if(b&&audio.duration)b.style.width=(audio.currentTime/audio.duration*100)+'%';const x=$('#mpx');if(x)x.textContent=fmt(audio.currentTime)});
audio.addEventListener('play',()=>{const t=$('#mpt');if(t)t.textContent='❚❚'});audio.addEventListener('pause',()=>{const t=$('#mpt');if(t)t.textContent='▶'});
audio.addEventListener('play',()=>{const p=MC();if(p&&mcOn)try{p.updateIsPlaying({isPlaying:true})}catch(e){}if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
audio.addEventListener('pause',()=>{const p=MC();if(p&&mcOn)try{p.updateIsPlaying({isPlaying:false})}catch(e){}if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
function setPlaying(i){
 cur=i;
 document.querySelectorAll('.ayat').forEach(e=>{
  const on=+e.dataset.i===i;e.classList.toggle('on',on);
  const b=$('[data-play]',e);if(b)b.classList.toggle('on',on);
 });
}
function play(i){
 const a=S.ayat[i];if(!a||!a.au)return;
 if(cur===i&&!audio.paused){audio.pause();setPlaying(-1);return}
 audio.src=(a.aus&&a.aus[cfg.qari])||a.au;
 audio.play().then(()=>{setPlaying(i);lastI=i;notif(i,true);mpLbl();const el=$('#a'+a.n);if(el)el.scrollIntoView({block:'center'})}).catch(()=>{setPlaying(-1)});
}
audio.onended=()=>{if(S&&cur>=0&&cur+1<S.ayat.length&&!(cfg.rukuStop&&S.ayat[cur].re))play(cur+1);else{setPlaying(-1);mcDestroy()}};
audio.onerror=()=>setPlaying(-1);

 const items=S.ayat.map((x,i)=>'<section class="ayat" id="a'+x.n+'" data-i="'+i+'" data-n="'+x.n+'"><div class="ah"><small class="jh">'+(x.j||'')+'<br>h.'+(x.pg||'')+'</small>'+

  '</div>'+
  '<p class="arab" dir="rtl" lang="ar">'+arHTML(hasTj&&x.tj?x.tj:x.ar,hasTj&&x.tj)+' <span class="an">'+arNum(x.n)+(x.re?'<sup>ع</sup>':'')+(x.sj?'<sup class="sj">۩</sup>':'')+'</span></p>'+
  '<p class="lat">'+esc(x.lat).replace(/[āīū]/g,c=>'<u>'+c+'</u>')+'</p><p class="idn">'+esc(x.id)+'</p>'+
  (x.re?'<div class="rk">ع Akhir ruku’ — di sini boleh berhenti</div>':'')+(x.sj?'<div class="rk">۩ Ayat sajdah</div>':'')+'</section>').join('');
 app.innerHTML='<div class="ban"><span>'+(/mad/i.test(S.tempat||'')?'Madaniyah':'Makkiyah')+'</span><b>'+S.nomor+'. '+esc(S.namaLatin)+'</b><span>'+S.jumlahAyat+' Ayat</span></div>'+
  '<div class="bsr"><button data-h="#/s/'+(n-1)+'"'+(n<=1?' disabled':'')+' aria-label="Surah sebelumnya">‹</button><div class="bsm" dir="rtl" lang="ar">'+ar+'</div><button data-h="#/s/'+(n+1)+'"'+(n>=114?' disabled':'')+' aria-label="Surah berikutnya">›</button></div>'+items;
 $('#mp').hidden=false;mpLbl();
 if(a&&$('#a'+a)){$('#a'+a).scrollIntoView({block:'start'})}else window.scrollTo(0,0);
 obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)st.set('last',{s:S.nomor,name:S.namaLatin,a:+e.target.dataset.n})})},{rootMargin:'-20% 0px -65% 0px'});
 document.querySelectorAll('.ayat').forEach(e=>obs.observe(e));
}

['Akhir kalimat berharokat Fathatain, Fathah Tegak, Fathah bertemu Alif','Fathatain diganti alif panjang 2 harakat. Fathah dibaca sukun.','عَلِيمًا ← عَلِيمَا'],
['Akhir kalimat Wau Sukun didahului Dlommah, atau Ya’ Sukun didahului Kasroh','Dibaca mad sukun; panjang mengikuti Mad ‘Aridh Lissukun.','يَقُولُ ← يَقُولْ'],
['Tanda-Tanda Waqaf','مـ wajib berhenti · لا jangan berhenti · ج boleh berhenti atau lanjut · صلى lebih baik lanjut · قلى lebih baik berhenti · ۛ ۛ berhenti di salah satu · س saktah (berhenti sejenak tanpa napas).','']]]
];
function viewTajwid(n){
 audio.pause();setPlaying(-1);if(obs)obs.disconnect();
 if(!n){setBar('Ilmu Tajwid',true);
  app.innerHTML='<button class="resume" data-a="guide"><span><small>Legenda</small><b>Warna tajwid dan tanda waqaf</b></span><span class="ar">ۖ</span></button><div class="grp">'+
   CH.map((c,i)=>'<button class="row cv" data-h="#/tajwid/'+(i+1)+'"><span class="no">'+(i+1)+'</span><span><b>'+esc(c[0])+'</b><small>'+c[1].length+' Hukum</small></span><span></span></button>').join('')+'</div>';
  return}
 const c=CH[n-1];setBar(c[0].replace(/\s*\(.*$/,''),true);
 app.innerHTML='<div class="grp" style="margin-top:16px">'+c[1].map((h,j)=>'<button class="row cv" data-t="'+n+'-'+j+'"><span class="no">'+(j+1)+'</span><span><b>'+esc(h[0])+'</b></span><span></span></button>').join('')+'</div>';
 window.scrollTo(0,0);
}
function showHukum(k){
 const [i,j]=k.split('-'),h=CH[i-1][1][j];
 sheet((h[2]?'<div class="big" style="color:var(--ac)">'+esc(h[2])+'</div>':'')+'<h2>'+esc(h[0])+'</h2><p>'+esc(h[1])+'</p>');
}
function legend(s){
 const c={};s.ayat.forEach(x=>(x.tj.match(/class=([a-z_]+)>/g)||[]).forEach(m=>{const k=m.slice(6,-1);c[k]=(c[k]||0)+1}));
 const tg=[['tajwid','Tajwid'],['latin','Latin'],['terjemah','Terjemah']].map(a=>'<button class="chip" data-tg="'+a[0]+'" aria-pressed="'+cfg[a[0]]+'">'+a[1]+'</button>').join('');
 const lg=Object.keys(c).filter(k=>TJM[k]).map(k=>'<button class="chip" data-chip="'+k+'" aria-pressed="false"><i style="background:'+TJM[k][2]+'"></i>'+TJM[k][1]+' <small>'+c[k]+'</small></button>').join('');
 return '<div class="chips"><button class="chip" data-playi="0" style="background:var(--ac);color:var(--on)">▶ Putar semua</button>'+tg+'</div>'+(lg?'<p class="hint">Ketuk huruf berwarna untuk melihat hukumnya. Ketuk label untuk menyorot satu hukum.</p><div class="chips sc">'+lg+'</div>':'');
}

/* ---------- aksi & router ---------- */
document.addEventListener('click',e=>{
 const t=e.target;
 const h=t.closest('[data-h]');if(h&&!h.disabled){location.hash=h.dataset.h;return}
 const p=t.closest('[data-play]');if(p){play(+p.dataset.play);return}
 const tj=t.closest('i.tj');if(tj){showTj(tj);return}
 const wq=t.closest('b.wq');if(wq){showWq(wq.dataset.w);return}
 if(!t.closest('#pp')&&!t.closest('i.tj'))closePop();
 const mb=t.closest('[data-mp]');if(mb){const k=mb.dataset.mp;if(k==='prev')play(Math.max(0,lastI-1));else if(k==='next')play(Math.min(S.ayat.length-1,lastI+1));else if(audio.src&&!audio.ended&&audio.currentTime>0)(audio.paused?audio.play():audio.pause());else play(lastI);return}
 const hk=t.closest('[data-hlk]');if(hk){closeSheet();app.dataset.hl=hk.dataset.hlk;document.querySelectorAll('[data-chip]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.chip===hk.dataset.hlk));return}
 const pi=t.closest('[data-playi]');if(pi){closeSheet();play(+pi.dataset.playi);return}
 const bm=t.closest('[data-bm]');if(bm){toggleBm(S.nomor,S.namaLatin,+bm.dataset.bm);bm.setAttribute('aria-pressed',isBm(S.nomor,+bm.dataset.bm));return}
 const ti=t.closest('[data-t]');if(ti){showHukum(ti.dataset.t);return}
 const tg=t.closest('[data-tg]');if(tg){cfg[tg.dataset.tg]=!cfg[tg.dataset.tg];tg.setAttribute('aria-pressed',cfg[tg.dataset.tg]);applyCfg();return}
 const cp=t.closest('[data-chip]');if(cp){const k=cp.dataset.chip,on=app.dataset.hl!==k;app.dataset.hl=on?k:'';document.querySelectorAll('[data-chip]').forEach(b=>b.setAttribute('aria-pressed',on&&b===cp));return}
 const ac=t.closest('[data-a]');if(!ac)return;
 const a=ac.dataset.a;
 if(a==='back')location.hash=/^#\/tajwid\/\d/.test(location.hash)?'#/tajwid':'#/';
 else if(a==='set')openSettings();
 else if(a==='guide')openGuide();
 else if(a==='retry')route();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function route(){
 closeSheet();
 const h=location.hash,tj=h.match(/^#\/tajwid(?:\/(\d+))?$/),m=h.match(/^#\/s\/(\d+)(?:\/(\d+))?$/);
 const mpe=$('#mp');if(mpe&&!m)mpe.hidden=true;
 if(tj&&(!tj[1]||(+tj[1]>=1&&+tj[1]<=CH.length)))viewTajwid(tj[1]?+tj[1]:0);
 else if(m&&+m[1]>=1&&+m[1]<=114)viewSurah(+m[1],m[2]?+m[2]:0);else viewList();
}
window.addEventListener('hashchange',route);
applyCfg();route();
})();
</script>
