<!DOCTYPE html>
<html lang="id" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10" id="tc">
<title>Zann Qur’an</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--arsize:36px;--ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ar:'Amiri Quran','Scheherazade New','Noto Naskh Arabic',serif;--r:18px}
[data-theme=midnight]{--bg:#0B0D10;--sf:#14181D;--sf2:#1C2128;--tx:#EEF2F0;--mu:#8B9892;--ln:#232A31;--ac:#5FD4A0;--on:#06251A;color-scheme:dark}
[data-theme=emerald]{--bg:#EEF4EF;--sf:#FBFDFB;--sf2:#E1ECE5;--tx:#16241E;--mu:#5E7168;--ln:#D3E0D8;--ac:#1F7A5C;--on:#fff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 var(--ui);transition:background .25s,color .25s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bar .in{max-width:680px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:8px}
.bar h1{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);display:grid;place-items:center;font-weight:600;font-size:15px}
.ib:active,.pill:active,.row:active{transform:scale(.96)}
.search{width:100%;height:48px;border:0;border-radius:14px;background:var(--sf);padding:0 16px;margin:6px 0 14px}
.search::placeholder{color:var(--mu)}
.resume{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:var(--r);background:var(--ac);color:var(--on);padding:16px 18px;margin-bottom:14px}
.resume small{display:block;opacity:.75}
.resume b{font-size:17px}
.resume .ar{font-family:var(--ar);font-size:26px}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-bottom:1px solid var(--ln)}
.row .no{width:38px;height:38px;border-radius:12px;background:var(--sf);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ac)}
.row b{display:block;font-weight:600}
.row small{color:var(--mu)}
.row .ar{font-family:var(--ar);font-size:24px;color:var(--ac)}
.hero{text-align:center;padding:22px 0 10px}
.hero .ar{font-family:var(--ar);font-size:46px;line-height:1.6;color:var(--ac)}
.hero p{margin:0;color:var(--mu);font-size:14px}
.bsm{font-family:var(--ar);font-size:calc(var(--arsize)*.85);text-align:center;padding:14px 0 6px;line-height:2}
.ayat{padding:22px 0;border-bottom:1px solid var(--ln);scroll-margin-top:76px;transition:background .3s}
.ayat.on{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 12%,transparent),transparent)}
.ah{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.num{min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--sf);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ac)}
.pill{height:38px;padding:0 16px;border:0;border-radius:19px;background:var(--sf);font-weight:600;font-size:14px;color:var(--ac)}
.ayat.on .pill{background:var(--ac);color:var(--on)}
.arab{font-family:var(--ar);font-size:var(--arsize);line-height:2.15;text-align:right;direction:rtl;word-spacing:.08em;margin:0}
.arab i{font-style:normal}
.wq{font-weight:400;color:var(--ac);cursor:pointer;padding:0 .1em}
.lat{margin:12px 0 0;color:var(--ac);font-size:14px;font-weight:500}
.idn{margin:6px 0 0;color:var(--mu)}
body.nolat .lat,body.noidn .idn{display:none}
body.notj .arab i{color:inherit!important}
.nav{display:flex;gap:10px;padding-top:24px}
.nav .pill{flex:1}
.nav .pill:disabled{opacity:.35}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;animation:f .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;max-height:86vh;overflow:auto;background:var(--sf);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:u .25s ease-out}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet h3{margin:20px 0 6px;font-size:15px;color:var(--ac)}
.sheet p{margin:4px 0;color:var(--mu)}
.big{font-family:var(--ar);font-size:44px;line-height:1.8;text-align:center}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.seg{display:flex;gap:6px}
.seg button{border:0;border-radius:12px;padding:9px 14px;background:var(--sf2);font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--on)}
input[type=range]{width:100%;accent-color:var(--ac);margin:8px 0}
.sw{width:50px;height:30px;border-radius:15px;border:0;background:var(--sf2);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:.2s}
.sw[aria-pressed=true]{background:var(--ac)}
.sw[aria-pressed=true]:after{left:23px;background:var(--on)}
.gl{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.gl .s{font-family:var(--ar);font-size:26px;text-align:center;line-height:1.6}
.gl b{display:block;font-weight:600}
.gl span{font-size:13.5px;color:var(--mu)}
.msg{text-align:center;padding:60px 10px;color:var(--mu)}
.msg button{margin-top:14px}
.sk{height:90px;border-radius:var(--r);background:var(--sf);margin:14px 0;animation:p 1.2s infinite alternate}
@keyframes u{from{transform:translateY(40px);opacity:0}}
@keyframes f{from{opacity:0}}
@keyframes p{to{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bar" class="bar"></div>
<main id="app" class="wrap"></main>
<script>
(function(){
'use strict';
const $=(s,e)=>(e||document).querySelector(s);
const app=$('#app'),barEl=$('#bar');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const st={get(k,d){try{const v=localStorage.getItem('zq:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zq:'+k,JSON.stringify(v))}catch(e){}}};
const cfg=Object.assign({theme:'midnight',size:36,tajwid:true,latin:true,terjemah:true},st.get('cfg',{}));

/* ---------- referensi: tajwid & waqaf ---------- */
const TJ=[
['madda_normal','Mad Thabi’i','#4DA3FF','Huruf mad tanpa hamzah atau sukun sesudahnya.','Dibaca panjang 2 harakat.'],
['madda_permissible','Mad Jaiz','#4DA3FF','Mad Munfashil, atau mad ‘Aridh Lissukun saat berhenti.','Boleh 2, 4, atau 5 harakat (‘Aridh: 2, 4, atau 6).'],
['madda_obligatory','Mad Wajib Muttashil','#2F7BFF','Mad thabi’i bertemu hamzah dalam satu kata.','Wajib dibaca panjang 4–5 harakat.'],
['madda_necessary','Mad Lazim','#6C5CE7','Huruf mad bertemu sukun asli atau tasydid dalam satu kata.','Dibaca panjang 6 harakat.'],
['qalaqah','Qalqalah','#E8A317','Huruf ق ط ب ج د yang sukun.','Dibunyikan memantul.'],
['ikhfa','Ikhfa Haqiqi','#E5604D','Nun sukun atau tanwin bertemu salah satu dari 15 huruf ikhfa.','Dibaca samar dengan dengung sekitar 2 harakat.'],
['ikhfa_shafawi','Ikhfa Syafawi','#E5604D','Mim sukun bertemu ba.','Dibaca samar dengan dengung, bibir dirapatkan ringan.'],
['iqlab','Iqlab','#D94FA6','Nun sukun atau tanwin bertemu ba.','Bunyi nun diganti mim, didengungkan sekitar 2 harakat.'],
['idgham_ghunnah','Idgham Bighunnah','#2FBF71','Nun sukun atau tanwin bertemu ya, nun, mim, atau wau di kata berikutnya.','Dilebur dengan dengung sekitar 2 harakat.'],
['idgham_wo_ghunnah','Idgham Bilaghunnah','#8A939B','Nun sukun atau tanwin bertemu lam atau ra.','Dilebur tanpa dengung.'],
['idgham_shafawi','Idgham Mimi','#2FBF71','Mim sukun bertemu mim.','Dilebur dengan dengung sekitar 2 harakat.'],
['idgham_mutajanisayn','Idgham Mutajanisain','#2FBF71','Dua huruf satu makhraj dengan sifat berbeda; yang pertama sukun.','Huruf pertama dilebur ke huruf kedua.'],
['idgham_mutaqaribayn','Idgham Mutaqaribain','#2FBF71','Dua huruf yang makhrajnya berdekatan; yang pertama sukun.','Huruf pertama dilebur ke huruf kedua.'],
['ghunnah','Ghunnah','#F0883E','Nun atau mim bertasydid.','Didengungkan sekitar 2 harakat.'],
['laam_shamsiyah','Lam Syamsiyah','#8A939B','Lam pada “al” bertemu huruf syamsiyah.','Lam tidak dibaca; huruf sesudahnya bertasydid.'],
['ham_wasl','Hamzah Wasal','#8A939B','Alif di awal kata yang hanya dibaca saat memulai.','Hilang saat disambung dengan kata sebelumnya.'],
['slnt','Huruf tidak dibaca','#8A939B','Ditulis tetapi tidak dilafalkan.','Lewati huruf ini saat membaca.']
];
const TJM={};TJ.forEach(t=>TJM[t[0]]=t);
const css=document.createElement('style');
css.textContent=TJ.map(t=>'.t-'+t[0]+'{color:'+t[2]+'}').join('');
document.head.appendChild(css);
const WQ={
'\u06D8':['م','Waqaf Lazim','Wajib berhenti. Jika disambung, makna bisa berubah.'],
'\u06D9':['لا','Laa (jangan berhenti)','Jangan berhenti di sini; sambung ke kata berikutnya.'],
'\u06DA':['ج','Waqaf Ja’iz','Boleh berhenti atau melanjutkan, sama baiknya.'],
'\u06D6':['صلى','Al-Washlu Awla','Lebih utama disambung, tetapi boleh berhenti.'],
'\u06D7':['قلى','Al-Waqfu Awla','Lebih utama berhenti, tetapi boleh disambung.'],
'\u06DB':['ۛ  ۛ','Mu’anaqah','Tanda berpasangan. Berhenti di salah satunya, bukan keduanya.'],
'\u06DC':['س','Saktah','Berhenti sejenak tanpa mengambil napas, lalu lanjut.']
};

/* ---------- data ---------- */
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function loadList(){
 const c=st.get('list');if(c)return c;
 const j=await getJSON('https://equran.id/api/v2/surat');
 st.set('list',j.data);return j.data;
}
async function loadSurah(n){
 const c=st.get('s'+n);if(c)return c;
 const [a,t]=await Promise.all([
  getJSON('https://equran.id/api/v2/surat/'+n),
  getJSON('https://api.quran.com/api/v4/quran/verses/uthmani_tajweed?chapter_number='+n+'&per_page=300').catch(()=>null)
 ]);
 const d=a.data,tv=(t&&t.verses)||[];
 const out={nomor:d.nomor,namaLatin:d.namaLatin,nama:d.nama,arti:d.arti,jumlahAyat:d.jumlahAyat,
  ayat:d.ayat.map((x,i)=>({n:x.nomorAyat,ar:x.teksArab,lat:x.teksLatin,id:x.teksIndonesia,
   au:(x.audio&&(x.audio['05']||Object.values(x.audio)[0]))||'',tj:(tv[i]&&tv[i].text_uthmani_tajweed)||''}))};
 if(tv.length===out.ayat.length)st.set('s'+n,out);
 return out;
}
function arHTML(raw,useTj){
 let s=String(raw);
 if(useTj)s=s.replace(/<tajweed class=([a-z_]+)>/g,'<i class="tj t-$1">').replace(/<\/tajweed>/g,'</i>').replace(/<span class=end>[^<]*<\/span>/g,'');
 return s.split(/(<[^>]*>)/).map(p=>{
  if(p.charAt(0)==='<')return /^<\/i>$|^<i class="tj t-[a-z_]+">$/.test(p)?p:'';
  return esc(p).replace(/[\u06D6-\u06DC]/g,c=>'<b class="wq" data-w="'+c+'">'+c+'</b>');
 }).join('');
}

/* ---------- UI helpers ---------- */
function applyCfg(){
 document.documentElement.dataset.theme=cfg.theme;
 document.documentElement.style.setProperty('--arsize',cfg.size+'px');
 $('#tc').content=cfg.theme==='midnight'?'#0B0D10':'#EEF4EF';
 document.body.classList.toggle('notj',!cfg.tajwid);
 document.body.classList.toggle('nolat',!cfg.latin);
 document.body.classList.toggle('noidn',!cfg.terjemah);
 st.set('cfg',cfg);
}
function closeSheet(){const s=$('#sh');if(s)s.remove()}
function sheet(html){
 closeSheet();
 const d=document.createElement('div');d.id='sh';
 d.innerHTML='<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
 document.body.appendChild(d);
 $('.scrim',d).onclick=closeSheet;
 return d;
}
function setBar(title,back){
 barEl.innerHTML='<div class="in">'+(back?'<button class="ib" data-a="back" aria-label="Kembali">←</button>':'')+
  '<h1>'+esc(title)+'</h1><button class="ib" data-a="guide" aria-label="Panduan tajwid dan waqaf">?</button>'+
  '<button class="ib" data-a="set" aria-label="Pengaturan">Aa</button></div>';
}
function openSettings(){
 const sw=(k,l)=>'<div class="set"><span>'+l+'</span><button class="sw" data-k="'+k+'" aria-pressed="'+cfg[k]+'" aria-label="'+l+'"></button></div>';
 const d=sheet('<h2>Pengaturan</h2>'+
  '<div class="set"><span>Tema</span><div class="seg"><button data-th="midnight" aria-pressed="'+(cfg.theme==='midnight')+'">Midnight Black</button><button data-th="emerald" aria-pressed="'+(cfg.theme==='emerald')+'">Soft Emerald</button></div></div>'+
  '<div style="padding:12px 0"><div class="set" style="border:0;padding:0"><span>Ukuran teks Arab</span><b id="szv">'+cfg.size+'</b></div>'+
  '<input type="range" id="sz" min="24" max="60" step="2" value="'+cfg.size+'" aria-label="Ukuran teks Arab"></div>'+
  sw('tajwid','Warna tajwid')+sw('latin','Teks latin')+sw('terjemah','Terjemahan'));
 d.onclick=e=>{
  const th=e.target.closest('[data-th]'),k=e.target.closest('[data-k]');
  if(th){cfg.theme=th.dataset.th;applyCfg();d.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b===th))}
  if(k){cfg[k.dataset.k]=!cfg[k.dataset.k];k.setAttribute('aria-pressed',cfg[k.dataset.k]);applyCfg()}
 };
 $('#sz',d).oninput=e=>{cfg.size=+e.target.value;$('#szv',d).textContent=cfg.size;applyCfg()};
}
function openGuide(){
 const wq=Object.keys(WQ).map(c=>'<div class="gl"><div class="s">'+c+'</div><div><b>'+WQ[c][0]+' · '+WQ[c][1]+'</b><span>'+WQ[c][2]+'</span></div></div>').join('');
 const tj=TJ.map(t=>'<div class="gl"><div class="s" style="color:'+t[2]+'">●</div><div><b>'+t[1]+'</b><span>'+t[3]+' '+t[4]+'</span></div></div>').join('');
 sheet('<h2>Panduan baca</h2><p>Ketuk huruf berwarna atau tanda waqaf di ayat untuk melihat penjelasannya.</p><h3>Tanda waqaf</h3>'+wq+'<h3>Hukum tajwid</h3>'+tj);
}
function showTj(el){
 const m=el.className.match(/t-([a-z_]+)/),t=m&&TJM[m[1]];if(!t)return;
 sheet('<div class="big" style="color:'+t[2]+'">'+esc(el.textContent)+'</div><h2 style="color:'+t[2]+'">'+t[1]+'</h2><p>'+t[3]+'</p><p><b style="color:var(--tx)">Cara baca:</b> '+t[4]+'</p>');
}
function showWq(c){
 const w=WQ[c];if(!w)return;
 sheet('<div class="big" style="color:var(--ac)">'+c+'</div><h2>'+w[0]+' · '+w[1]+'</h2><p>'+w[2]+'</p>');
}

/* ---------- daftar surah ---------- */
let LIST=[];
async function viewList(){
 audio.pause();setPlaying(-1);
 setBar('Zann Qur’an',false);
 app.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 try{LIST=await loadList()}catch(e){
  app.innerHTML='<div class="msg">Daftar surah gagal dimuat. Periksa koneksi internet.<br><button class="pill" data-a="retry">Coba lagi</button></div>';return}
 const last=st.get('last');
 app.innerHTML=(last?'<button class="resume" data-h="#/s/'+last.s+'/'+last.a+'"><span><small>Lanjutkan membaca</small><b>'+esc(last.name)+' · ayat '+last.a+'</b></span><span class="ar">'+arNum(last.a)+'</span></button>':'')+
  '<input class="search" id="q" type="search" placeholder="Cari surah, arti, atau nomor" autocomplete="off" aria-label="Cari surah"><div id="ls"></div>';
 const draw=q=>{
  q=q.trim().toLowerCase();
  const f=LIST.filter(s=>!q||String(s.nomor)===q||s.namaLatin.toLowerCase().includes(q)||s.arti.toLowerCase().includes(q)||s.nama.includes(q)||s.namaLatin.toLowerCase().replace(/[^a-z]/g,'').includes(q.replace(/[^a-z]/g,'')));
  $('#ls').innerHTML=f.length?f.map(s=>'<button class="row" data-h="#/s/'+s.nomor+'"><span class="no">'+s.nomor+'</span><span><b>'+esc(s.namaLatin)+'</b><small>'+esc(s.arti)+' · '+s.jumlahAyat+' ayat</small></span><span class="ar">'+esc(s.nama)+'</span></button>').join(''):'<div class="msg">Tidak ada surah yang cocok.</div>';
 };
 draw('');$('#q').oninput=e=>draw(e.target.value);
}

/* ---------- pembaca ---------- */
const audio=new Audio();audio.preload='none';
let S=null,cur=-1,obs=null;
function setPlaying(i){
 cur=i;
 document.querySelectorAll('.ayat').forEach(e=>{
  const on=+e.dataset.i===i;e.classList.toggle('on',on);
  const b=$('[data-play]',e);if(b)b.textContent=on?'Jeda':'Putar';
 });
}
function play(i){
 const a=S.ayat[i];if(!a||!a.au)return;
 if(cur===i&&!audio.paused){audio.pause();setPlaying(-1);return}
 audio.src=a.au;
 audio.play().then(()=>{setPlaying(i);const el=$('#a'+a.n);if(el)el.scrollIntoView({block:'center'})}).catch(()=>{setPlaying(-1)});
}
audio.onended=()=>{if(S&&cur>=0&&cur+1<S.ayat.length)play(cur+1);else setPlaying(-1)};
audio.onerror=()=>setPlaying(-1);

async function viewSurah(n,a){
 audio.pause();setPlaying(-1);
 if(obs)obs.disconnect();
 setBar('Memuat…',true);
 app.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 try{S=await loadSurah(n)}catch(e){
  app.innerHTML='<div class="msg">Surah gagal dimuat. Periksa koneksi internet.<br><button class="pill" data-a="retry">Coba lagi</button></div>';return}
 setBar(S.namaLatin,true);
 const hasTj=S.ayat.some(x=>x.tj);
 const bsm=(S.nomor!==1&&S.nomor!==9)?'<div class="bsm" dir="rtl" lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>':'';
 app.innerHTML='<div class="hero"><div class="ar" lang="ar">'+esc(S.nama)+'</div><p>'+esc(S.arti)+' · '+S.jumlahAyat+' ayat</p></div>'+bsm+
  S.ayat.map((x,i)=>'<section class="ayat" id="a'+x.n+'" data-i="'+i+'" data-n="'+x.n+'"><div class="ah"><span class="num">'+x.n+'</span>'+
   (x.au?'<button class="pill" data-play="'+i+'">Putar</button>':'')+'</div>'+
   '<p class="arab" dir="rtl" lang="ar">'+arHTML(hasTj&&x.tj?x.tj:x.ar,hasTj&&x.tj)+' <span class="wq" style="cursor:default">'+arNum(x.n)+'</span></p>'+
   '<p class="lat">'+esc(x.lat)+'</p><p class="idn">'+esc(x.id)+'</p></section>').join('')+
  '<div class="nav"><button class="pill" data-h="#/s/'+(n-1)+'"'+(n<=1?' disabled':'')+'>← Sebelumnya</button><button class="pill" data-h="#/s/'+(n+1)+'"'+(n>=114?' disabled':'')+'>Berikutnya →</button></div>';
 if(a&&$('#a'+a)){$('#a'+a).scrollIntoView({block:'start'})}else window.scrollTo(0,0);
 // bookmark otomatis: ayat yang sedang berada di area baca
 obs=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting)st.set('last',{s:S.nomor,name:S.namaLatin,a:+e.target.dataset.n})});
 },{rootMargin:'-20% 0px -65% 0px'});
 document.querySelectorAll('.ayat').forEach(e=>obs.observe(e));
}

/* ---------- aksi & router ---------- */
document.addEventListener('click',e=>{
 const t=e.target;
 const h=t.closest('[data-h]');if(h&&!h.disabled){location.hash=h.dataset.h;return}
 const p=t.closest('[data-play]');if(p){play(+p.dataset.play);return}
 const tj=t.closest('i.tj');if(tj){showTj(tj);return}
 const wq=t.closest('b.wq');if(wq){showWq(wq.dataset.w);return}
 const ac=t.closest('[data-a]');if(!ac)return;
 const a=ac.dataset.a;
 if(a==='back')location.hash='#/';
 else if(a==='set')openSettings();
 else if(a==='guide')openGuide();
 else if(a==='retry')route();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function route(){
 closeSheet();
 const m=location.hash.match(/^#\/s\/(\d+)(?:\/(\d+))?$/);
 if(m&&+m[1]>=1&&+m[1]<=114)viewSurah(+m[1],m[2]?+m[2]:0);else viewList();
}
window.addEventListener('hashchange',route);
applyCfg();route();
})();
</script>
